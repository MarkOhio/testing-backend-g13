<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - Eventify Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="staff" data-protected="yes">
    <div id="navArea"></div>
    <div class="main">
        <div class="page-title-row only-mobile">
            <a class="back" href="dashboard.html" data-back aria-label="Back"></a>
            <h1 class="title" style="font-size:18px">Event Staff Management</h1>
        </div>
        <div class="page-head only-desktop">
            <div><h1>Staff Management</h1><p>Manage the staff who check in your attendees.</p></div>
           </div>

           <div class="head-actions staff-head-actions" style="margin-bottom: 24px;" id="addstaff">
            <button class="btn openAdd" type="button" >+ Add Staff</button>
            <div class="search-box staff-main-search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input type="text" id="staffMainSearch" placeholder="Search by name or email">
            </div>
            
        </div>
        <div id="staffView">
            <div class="only-mobile" style="text-align:right;margin-bottom:22px">
                 <div class="head-actions staff-head-actions" style="margin-bottom: 24px;"  >
            <button class="btn openAdd" type="button" >+Add</button>
            <div class="search-box staff-main-search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input type="text" id="staffMainSearch" placeholder="Search by name or email">
            </div>
            
        </div>
            </div>
            <div class="only-mobile" id="mStaff"></div>
            <div class="only-desktop table-box">
                <table class="data">
                    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Assigned Events</th><th>Status</th><th>Gate</th></tr></thead>
                    <tbody id="staffBody"></tbody>
                </table>
            </div>
        </div>

        <div id="addView" class="hidden">
            <div style="margin-bottom:16px"><button class="btn btn-outline btn-small" id="closeAdd" type="button">Back to staff</button></div>
            <div class="search-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="text" id="staffSearch" placeholder="Search by name"></div>
            <div id="candidateList"></div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="common.js"></script>
    <script src="staff.js"></script>
</body>
</html>
