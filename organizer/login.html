<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Eventify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
    <div class="auth">
        <div class="auth-side only-desktop">
            <div class="brand"><div class="logo-mark"><img src="assets/logo.png" alt=""></div> </div>
            <div>
                <h2>Smarter Events.</h2>
                <p>Register. Check in. better experience.</p>
                <span style="display: flex; align-items: center; gap: 10px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg>
                    <p>Create, manage and track your events <br>all in one place</p>
                </span>
            </div>
        </div>
        <div class="auth-main">
            <div class="auth-box">
                <div class="auth-top"><a class="back" href="../index.html" data-back aria-label="Back"></a></div>
                <h1 class="title only-mobile">Log into your account</h1>
                <p class="sub only-mobile" style="margin-bottom:26px">Enter your email and password</p>
                <h1 class="desktop-title only-desktop">Log into your account</h1>
                <p class="desktop-sub only-desktop">Enter your email and password</p>
                <form id="loginForm" style="display:flex;flex-direction:column;flex:1">
                    <div class="field">
                        <label class="label" for="loginEmail">Email address</label>
                        <div class="input-wrap"><span class="lead"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7L4 7.5V17h16V7.5L12 12zm0-2 8-4H4l8 4z"/></svg></span><input class="input has-icon" id="loginEmail" type="email" placeholder="Enter your email address"></div>
                    </div>
                    <div class="field">
                        <label class="label" for="loginPassword">Password</label>
                        <div class="input-wrap"><input class="input" id="loginPassword" type="password" placeholder="Enter your password"><button type="button" class="eye" data-eye="loginPassword" aria-label="Show password"></button></div>
                    </div>
                    <div class="only-desktop" style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:14px">
                        <label><input type="checkbox" id="remember"> Remember me</label>
                        <a href="#" id="forgotLink" style="color:#5B4BDB">Forgot Password?</a>
                    </div>
                    <p class="error-text" id="errorText"></p>
                    <div class="bottom">
                        <button class="btn" type="submit"><span class="only-mobile">Continue</span><span class="only-desktop">Log in</span></button>
                        <p class="auth-foot">Don’t have an account? <a href="signup.html">Sign up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="common.js"></script>
    <script src="login.js"></script>
</body>
</html>
