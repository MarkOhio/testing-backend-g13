<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password - Eventify</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="confirm-reset-password">
<div class="auth"><div class="auth-side only-desktop"><div class="brand"><div class="logo-mark"><img src="assets/logo.png" alt=""></div></div><div><h2>Smarter Events.</h2><p>Create a new password for your account.</p></div></div>
<div class="auth-main"><div class="auth-box"><div class="auth-top"><a class="back" href="verify-reset-code.html" aria-label="Back"></a></div>
<h1 class="title only-mobile">Set new password</h1><p class="sub only-mobile">Choose a new password for your account.</p><h1 class="desktop-title only-desktop">Set new password</h1><p class="desktop-sub only-desktop">Choose a new password for your account.</p>
<form id="newPasswordForm" style="display:flex;flex-direction:column;flex:1">
<div class="field"><label class="label" for="newPassword">New password</label><div class="input-wrap"><input class="input" id="newPassword" type="password" required minlength="6" placeholder="Enter new password"></div></div>
<div class="field"><label class="label" for="confirmNewPassword">Confirm new password</label><div class="input-wrap"><input class="input" id="confirmNewPassword" type="password" required minlength="6" placeholder="Confirm new password"></div></div>
<p class="otp-msg" id="newPasswordMsg" aria-live="polite"></p><div class="bottom"><button class="btn" type="submit" id="saveNewPasswordBtn">Save new password</button></div>
</form></div></div></div>
<script src="backend.js"></script><script src="common.js"></script><script src="confirm-reset-password.js"></script>
</body></html>
