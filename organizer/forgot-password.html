<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - Eventify</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="forgot-password">
<div class="auth">
<div class="auth-side only-desktop"><div class="brand"><div class="logo-mark"><img src="assets/logo.png" alt=""></div></div><div><h2>Smarter Events.</h2><p>Recover access to your Eventify account.</p></div></div>
<div class="auth-main"><div class="auth-box">
<div class="auth-top"><a class="back" href="login.html" aria-label="Back"></a></div>
<h1 class="title only-mobile">Forgot password?</h1><p class="sub only-mobile">Enter your email to receive a recovery code.</p>
<h1 class="desktop-title only-desktop">Forgot password?</h1><p class="desktop-sub only-desktop">Enter your email to receive a recovery code.</p>
<form id="forgotForm" style="display:flex;flex-direction:column;flex:1">
<div class="field"><label class="label" for="recoveryEmail">Email address</label><div class="input-wrap"><input class="input" id="recoveryEmail" type="email" required placeholder="Enter your email address"></div></div>
<p id="recoveryMsg" class="otp-msg" aria-live="polite"></p>
<div class="bottom"><button class="btn" type="submit" id="getRecoveryCode">Get code</button><p class="auth-foot"><a href="login.html">Back to login</a></p></div>
</form>
</div></div></div>
<script src="backend.js"></script><script src="common.js"></script><script src="forgot-password.js"></script>
</body></html>
