<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event - Eventify Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="events" data-protected="yes">
    <div id="navArea"></div>
    <div class="main">
        <input type="file" id="imageFile" accept="image/*" class="hidden">
        <input type="file" id="codesFile" accept=".csv,.txt,.xls,.xlsx" class="hidden">

        <div class="only-mobile">
            <div class="page-title-row">
                <a class="back" href="events.html" data-back aria-label="Back"></a>
                <h1 class="title" id="mTitle">Create New Event</h1>
            </div>
            <div class="tab-row three" id="mTabs">
                <button class="active" data-tab="tabDetails">Details</button>
                <button data-tab="tabStaff">Staff</button>
                <button data-tab="tabTicket">Ticket</button>
            </div>

            <div class="tab-panel show" id="tabDetails">
                <div class="form-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> Event Information</div>
                <div class="field"><label class="label" for="mName">Event Name</label><input class="input" id="mName" type="text" placeholder="Tech & Creators Summit 2026"></div>
                <div class="two-col">
                    <div class="field"><label class="label" for="mDate">Date</label><input class="input" id="mDate" type="text" placeholder="17th Oct, 2026"></div>
                    <div class="field"><label class="label" for="mTime">Time</label><input class="input" id="mTime" type="text" placeholder="10:00AM"></div>
                </div>
                <div class="field"><label class="label" for="mLocation">Event Location</label><input class="input" id="mLocation" type="text" placeholder="Eko Conventional Center, V.I, Lagos"></div>
                <div class="field"><label class="label" for="mAbout">About Event</label><input class="input" id="mAbout" type="text" placeholder="Tell us about your event"></div>
                <button class="btn btn-outline btn-small imageBtn" type="button">Upload image</button>
                <p class="file-msg imageMsg" style="text-align:left"></p>
                <div style="margin-top:30px">
                    <button class="btn" id="next1" type="button">Next</button>
                    <a class="cancel-link" href="events.html">Cancel</a>
                </div>
            </div>

            <div class="tab-panel" id="tabStaff">
                <div class="search-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="text" id="mStaffSearch" placeholder="Search by name"></div>
                <div id="mStaffList"></div>
                <div style="margin-top:30px"><button class="btn" id="next2" type="button">Next</button></div>
            </div>

            <div class="tab-panel" id="tabTicket">
                <div class="upload-zone">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m12 16V9m0 0-3 3m3-3 3 3"/></svg>
                    <p>Upload Ticket Code here</p>
                    <small>Supported CSV, TXT or XLS</small>
                </div>
                <button class="btn btn-outline codesBtn" type="button">Choose file</button>
                <p class="file-msg codesMsg"></p>
                <div style="margin-top:30px"><button class="btn createBtn" type="button" id="mCreate">Create Event</button></div>
            </div>
        </div>

        <div class="only-desktop">
            <div class="page-head">
                <div><h1 id="dTitle">Create New Event</h1><p>Fill in the details below and create your event.</p></div>
            </div>
            <div class="create-grid">
               
                <div>
                    <div class="field"><label class="label" for="dEventTitle">Event Title</label><input class="input" id="dEventTitle" type="text" placeholder="Enter event name"></div>
                    <div class="field"><label class="label" for="dType">Event Type</label>
                        <select class="input" id="dType"><option value="">Select event type</option><option>Conference</option><option>Concert</option><option>Workshop</option><option>Networking</option></select>
                    </div>
                    <div class="two-col">
                        <div class="field"><label class="label" for="dStart">Start Date</label><input class="input" id="dStart" type="date"></div>
                        <div class="field"><label class="label" for="dEnd">End Date</label><input class="input" id="dEnd" type="date"></div>
                    </div>
                    <div class="two-col">
                        <div class="field"><label class="label" for="dStartTime">Start Time</label><input class="input" id="dStartTime" type="time"></div>
                        <div class="field"><label class="label" for="dEndTime">End Time</label><input class="input" id="dEndTime" type="time"></div>
                    </div>
                    <div class="field"><label class="label" for="dVenue">Venue / Location</label><input class="input" id="dVenue" type="text" placeholder="Enter location"></div>
                    <div class="field"><label class="label" for="dDescription">Description</label><textarea class="input" id="dDescription" placeholder="Tell us about your event..."></textarea></div>
                </div>
                <div class="create-side">
                     <div>
                    <label class="label">Event Image</label>
                    <button class="upload-box imageBtn" type="button">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/></svg>
                        <span>Click to upload event image</span>
                        <small class="imageMsg">JPG, PNG (Max 5MB)</small>
                    </button>
                </div>
                    <div class="field"><label class="label" for="dStaff">Assign Staff</label>
                        <select class="input" id="dStaff"><option value="">Select Staff members</option></select>
                    </div>
                    <label class="label">Event Link</label>
                    <div class="switch-row"><span>Auto-generate Link</span><button type="button" class="switch" id="linkSwitch" aria-label="Auto-generate link"></button></div>
                    <div class="link-row"><input type="text" id="eventLink" value="https://eventify.com/e/tech-creators-"><button type="button" id="copyLink">Copy</button></div>
                    <label class="label">Share Via</label>
                    <div class="share-row">
                        <button type="button" class="shareBtn">Email</button>
                        <button type="button" class="shareBtn">Whatsapp</button>
                        <button type="button" class="shareBtn">Link</button>
                    </div>
                </div>
            </div>
            <div class="create-actions">
                <a class="btn btn-outline" href="events.html">Cancel</a>
                <button class="btn createBtn" type="button" id="dCreate">Create event</button>
            </div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="common.js"></script>
    <script src="create-event.js"></script>
</body>
</html>
