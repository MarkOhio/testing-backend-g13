<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Eventify Organizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="attendance" data-protected="yes">
    <div id="navArea"></div>
    <div class="main">
        <div class="only-mobile">
            <div id="mLive">
                <h1 class="title" style="font-size:24px;margin-bottom:18px">Live Attendance</h1>
                <div class="donut" id="mDonut"><div class="donut-text"><b id="mCount">0</b><span>Checked in</span></div></div>
                <p class="percent-text" id="mPercent"></p>
                <div class="toggle-row"><button class="active" data-view="live">Live</button><button data-view="history">History</button></div>
                <div id="mLiveList"></div>
            </div>
            <div id="mHistory" class="hidden">
                <div class="page-title-row">
                    <button class="back" id="histBack" aria-label="Back" data-back></button>
                    <h1 class="title">Attendance History</h1>
                </div>
                <div class="date-field"><span id="mHistDate"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
                <div class="hist-head"><span>Name</span><span>Time</span><span>Status</span></div>
                <div id="mHistList"></div>
                <button class="btn exportBtn" type="button" style="margin-top:30px">Export Results</button>
            </div>
        </div>

        <div class="only-desktop">
            <div class="page-head">
                <div><h1 id="dTitle">Live Attendance</h1><p id="dSub">Track and monitor who’s currently at your event in real time.</p></div>
                <div class="head-actions" id="liveActions"><span class="live-badge">LIVE</span><button class="btn btn-outline" id="refreshBtn" type="button">Refresh</button></div>
                <div class="head-actions hidden" id="historyActions"><button class="btn exportBtn" type="button">Export Results</button></div>
            </div>
            <div class="desk-tabs"><button class="active" data-view="live">Live Attendance</button><button data-view="history">Attendance History</button></div>

            <div id="dLive">
                <div class="stat-grid">
                    <div class="stat-card"><div><p class="label-sm">Total Attendees</p><p class="value" id="dTotal">0</p></div></div>
                    <div class="stat-card"><div><p class="label-sm">Checked in</p><p class="value" id="dChecked">0</p></div></div>
                    <div class="stat-card"><div><p class="label-sm">Remaining</p><p class="value" id="dRemaining">0</p></div></div>
                </div>
                <div class="table-tools">
                    <div class="search-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="text" id="liveSearch" placeholder="Search by name or ticket type"></div>
                    <button class="btn btn-outline" id="filterBtn" type="button" style="width:auto;padding:0 22px">Filter</button>
                </div>
                <div class="table-box"><table class="data">
                    <thead><tr><th>Name</th><th>Ticket type</th><th>Checked in Time</th><th>Status</th><th>Gate</th></tr></thead>
                    <tbody id="liveBody"></tbody>
                </table></div>
            </div>

            <div id="dHistory" class="hidden">
                <div class="date-chip" style="display:inline-flex;margin-bottom:20px"><span id="dHistDate"></span></div>
                <div class="table-box"><table class="data">
                    <thead><tr><th>Name</th><th>Ticket type</th><th>Time</th><th>Status</th><th>Gate</th></tr></thead>
                    <tbody id="histBody"></tbody>
                </table></div>
            </div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="common.js"></script>
    <script src="attendance.js"></script>
</body>
</html>
