<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Ins - Eventify Staff</title>
   <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="history" data-protected="yes">
    <div id="navArea"></div>
    <div class="main">
        <div class="page-title-row only-mobile">
            <a class="back" href="dashboard.html" data-back aria-label="Back"></a>
            <h1 class="title">Check Ins</h1>
        </div>
        <div class="page-head only-desktop">
            <div><h1>Check-in History</h1><p id="histEvent"></p></div>
            <div class="head-actions">
                <select class="input" id="deskFilter" style="width:170px;height:42px">
                    <option value="All">All status</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Duplicate">Duplicate</option>
                    <option value="Declined">Declined</option>
                </select>
            </div>
        </div>

        <div class="filter-row only-mobile">
            <button class="chip chip-main" id="allChip" type="button">All</button>
            <select class="chip chip-soft" id="statusFilter">
                <option value="All">Status</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Duplicate">Duplicate</option>
                <option value="Declined">Declined</option>
            </select>
        </div>

        <div class="only-mobile" id="mHistory"></div>
        <div class="only-desktop table-box">
            <table class="data">
                <thead><tr><th>Time</th><th>Name</th><th>Ticket Code</th><th>Status</th><th>Gate</th></tr></thead>
                <tbody id="hBody"></tbody>
            </table>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="common.js"></script>
    <script src="check-ins.js"></script>
</body>
</html>
